<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Advertisement</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; }
  body { display: flex; align-items: center; gap: 14px; padding: 0 14px; box-sizing: border-box; background: linear-gradient(#f4f8ff, #e3ecfb); border: 1px solid #c9d6ee; }
  .what { flex: 1; font-size: 13px; color: #223; line-height: 1.3; }
  .what b { font-size: 15px; display: block; }
  .go { display: inline-block; background: #1f9d3a; color: #fff; font-weight: bold; font-size: 17px; text-decoration: none; padding: 11px 22px; border-radius: 5px; box-shadow: 0 2px 0 #14702a; white-space: nowrap; }
  .tag { position: absolute; top: 2px; right: 5px; font-size: 8px; color: #9aa7bd; letter-spacing: .4px; }
  body.tall { flex-direction: column; justify-content: center; text-align: center; padding: 14px; }
</style>
</head>
<body>
  <span class="tag">Ad</span>
  <div class="what"><b id="headline">Your download is ready</b><span id="line">PC Speed Helper 2026 — 1 file waiting</span></div>
  <a class="go" id="go" href="landing.html" target="_top">⬇ DOWNLOAD</a>
<script>
  // ?style=continue shows a "Continue" button; ?shape=tall stacks it for the side column.
  const p = new URLSearchParams(location.search);
  if (p.get('style') === 'continue') {
    document.getElementById('headline').textContent = 'One more step';
    document.getElementById('line').textContent = 'Claim your free gift card before you go';
    document.getElementById('go').textContent = 'Continue ➜';
  }
  if (p.get('shape') === 'tall') document.body.classList.add('tall');
</script>
</body>
</html>
